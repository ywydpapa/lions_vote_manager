<!DOCTYPE html>
<html lang="ko">
<head>
    {% include '/common/header.html' %}
    <style>
        .table-schedule th {
            background-color: #f8f9fa;
            font-weight: 700;
            color: #495057;
            text-align: center;
            vertical-align: middle;
        }

        .table-schedule td {
            vertical-align: middle;
            text-align: center;
        }

        /* 방문 일정 링크(버튼) 스타일 */
        .visit-link {
            text-decoration: none !important;
            border-radius: 0.5rem;
            padding: 0.4rem 0.8rem;
            font-size: 0.9rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            transition: all 0.2s ease-in-out;
            border: 1px solid transparent;
        }

        .visit-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        /* 완료된 예약 (붉은색) */
        .status-done {
            background-color: #fff5f5;
            color: #dc3545;
            border-color: #dc3545;
        }

        /* 도착한 예약 (초록색) */
        .status-arrive {
            background-color: #f0fdf4;
            color: #198754;
            border-color: #198754;
        }

        /* 대기 중인 예약 (검은색/회색) */
        .status-pending {
            background-color: #f8f9fa;
            color: #212529;
            border-color: #ced4da;
        }

        /* 검색창 포커스 스타일 */
        #searchInput:focus {
            box-shadow: none;
            border-color: #ced4da;
        }
    </style>
</head>
<body class="d-flex flex-column h-100 bg-light">
<main class="flex-shrink-0">
    <!-- Navigation-->
    {% include '/common/topnav.html' %}

    <!-- Page Content-->
    <div class="container px-5 my-5">
        <div class="text-center mb-5">
            <h1 class="display-5 fw-bolder mb-0"><span class="text-gradient d-inline">클럽별 방문 목록</span></h1>
        </div>

        <!-- 검색창 -->
        <div class="row gx-5 justify-content-center mb-4">
            <div class="col-lg-6 col-xl-5">
                <div class="input-group shadow-sm rounded-3">
                    <span class="input-group-text bg-white border-end-0"><i class="bi bi-search text-muted"></i></span>
                    <input type="text" id="searchInput" class="form-control border-start-0 ps-0" placeholder="클럽명을 검색하세요..." oninput="filterClubs()">
                </div>
            </div>
        </div>

        <div class="row gx-5 justify-content-center">
            <div class="col-lg-12 col-xl-11">
                <div id="scheduleRoot"></div>
            </div>
        </div>
    </div>
</main>

<!-- Footer-->
{% include '/common/footer.html' %}
{% include '/common/adscript.html' %}

<script>
  const pad2 = (n) => String(n).padStart(2, '0');

  const formatDateTime = (d) => {
      return `${d.getMonth()+1}월 ${d.getDate()}일 ${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
  };

  function reservDtlUrl(reservNo) {
    const n = Number(reservNo);
    if (!Number.isFinite(n)) return '#';
    return `/view_reservdtl_candi2/${n}`;
  }

  function escapeHtml(s) {
    return String(s ?? '')
      .replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')
      .replaceAll('"','&quot;').replaceAll("'","&#039;");
  }

  // === 화면을 그리는 메인 함수 ===
  function renderSchedule(reservsData, clubsData) {
    let rawReservs = (reservsData ?? []).map(r => ({ ...r, _dt: new Date(r.reservFrom) }));
    let rawClubs = clubsData ?? [];

    // 1. 클럽 데이터 중복 제거 (clubNo 기준) 및 클럽번호 0 제외
    const uniqueClubsMap = new Map();
    for (const club of rawClubs) {
        // 💡 클럽 번호가 0이거나 '0'인 경우 건너뛰기 (표시 안 함)
        if (club.clubNo === 0 || String(club.clubNo) === '0') {
            continue;
        }

        if (!uniqueClubsMap.has(club.clubNo)) {
            uniqueClubsMap.set(club.clubNo, club);
        }
    }
    const clubs = Array.from(uniqueClubsMap.values());

    // 2. 예약 데이터 중복 제거 (reservNo 기준)
    const uniqueReservsMap = new Map();
    for (const r of rawReservs) {
        if (!uniqueReservsMap.has(r.reservNo)) {
            uniqueReservsMap.set(r.reservNo, r);
        }
    }
    const reservs = Array.from(uniqueReservsMap.values());

    // 클럽 번호(clubNo)를 기준으로 오름차순 정렬
    clubs.sort((a, b) => Number(a.clubNo) - Number(b.clubNo));

    const root = document.getElementById('scheduleRoot');

    if (clubs.length === 0) {
      root.innerHTML = `<div class="text-muted p-4 text-center bg-white rounded shadow-sm">검색된 클럽이 없습니다.</div>`;
      return;
    }

    // 클럽 번호(clubNo)를 기준으로 예약 데이터 그룹화
    const reservsByClub = {};
    for (const r of reservs) {
        if (!reservsByClub[r.clubNo]) {
            reservsByClub[r.clubNo] = [];
        }
        reservsByClub[r.clubNo].push(r);
    }

    // 각 클럽의 예약 데이터를 시간순으로 정렬
    for (const clubNo in reservsByClub) {
        reservsByClub[clubNo].sort((a, b) => a._dt - b._dt);
    }

    let html = `
      <div class="card shadow-sm border-0 rounded-4 overflow-hidden">
        <div class="table-responsive">
          <table class="table table-bordered table-hover table-schedule mb-0">
            <thead>
              <tr>
                <th style="width: 15%;">클럽 번호</th>
                <th style="width: 25%;">클럽명</th>
                <th style="width: 60%;">방문 일정 (클릭 시 상세 이동)</th>
              </tr>
            </thead>
            <tbody>
    `;

    // 클럽 목록을 순회하며 표의 행(Row) 생성
    for (const club of clubs) {
      const cNo = club.clubNo;
      const cName = club.clubName;
      const clubReservs = reservsByClub[cNo] || [];

      html += `<tr>
        <td class="fw-bold align-middle bg-light">${escapeHtml(cNo)}</td>
        <td class="fw-bold align-middle bg-light">
            <a href="/view_clubdtl_candi/${escapeHtml(cNo)}" class="text-decoration-none text-primary">
                ${escapeHtml(cName)}
            </a>
        </td>
        <td class="text-start align-middle p-3">
      `;

      if (clubReservs.length === 0) {
        html += `<span class="text-muted small">방문기록이 없습니다.</span>`;
      } else {
        html += `<div class="d-flex flex-wrap gap-2">`;

        for (const r of clubReservs) {
            const status = r.attrib;
            let textClass = 'status-pending';
            if (status === '1DONE1DONE') {
              textClass = 'status-done';
            } else if (status === '1111111111') {
              textClass = 'status-arrive';
            }

            html += `
              <a href="${reservDtlUrl(r.reservNo)}" class="visit-link ${textClass}" title="${escapeHtml(r.reservMemo)}">
                <i class="bi bi-calendar-check"></i> ${formatDateTime(r._dt)}
                <span class="badge bg-secondary bg-opacity-25 text-dark ms-1">${escapeHtml(r.visitorName)} ${r.visitCnt}명</span>
              </a>
            `;
        }
        html += `</div>`;
      }

      html += `</td></tr>`;
    }

    html += `
            </tbody>
          </table>
        </div>
      </div>
    `;
    root.innerHTML = html;
  }

  // 전역 변수로 데이터 저장 (검색 필터링용)
  let currentReservs = [];
  let currentClubs = [];

  const initialReservs = {{ reservs | tojson }};
  const initialClubs = {{ clubs | tojson }};

  currentReservs = initialReservs;
  currentClubs = initialClubs;

  renderSchedule(currentReservs, currentClubs);

  // 검색 필터링 함수
  function filterClubs() {
    const query = document.getElementById('searchInput').value.toLowerCase().trim();

    if (!query) {
        renderSchedule(currentReservs, currentClubs);
        return;
    }

    // 클럽명에 검색어가 포함된 클럽만 필터링
    const filteredClubs = currentClubs.filter(club =>
        club.clubName && club.clubName.toLowerCase().includes(query)
    );

    renderSchedule(currentReservs, filteredClubs);
  }

  // AJAX로 최신 데이터를 가져오는 함수
  async function fetchLatestSchedule() {
    try {
      const response = await fetch('/api/get_reserv');
      if (response.ok) {
        const data = await response.json();
        currentClubs = data.clubs ? data.clubs : initialClubs;
        currentReservs = data.reservs;

        // 데이터 갱신 후 현재 검색어 상태를 유지하며 렌더링
        filterClubs();
      }
    } catch (error) {
      console.error("스케줄 데이터를 불러오는 중 오류 발생:", error);
    }
  }

  window.addEventListener('pageshow', function(event) {
    if (event.persisted) {
      fetchLatestSchedule();
    }
  });
</script>
<!-- Bootstrap Icons -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</body>
</html>
